name: DevOps Revision Tracker CI/CD

on:
  push:
    branches: [main]
    paths:
      - "capstone-devops-revision-tracker/**"
      - ".github/workflows/capstone-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "capstone-devops-revision-tracker/**"
      - ".github/workflows/capstone-ci-cd.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: capstone-devops-revision-tracker/backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: capstone-devops-revision-tracker/backend
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: capstone-devops-revision-tracker/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: capstone-devops-revision-tracker/frontend
        run: npm ci

      - name: Build frontend
        working-directory: capstone-devops-revision-tracker/frontend
        run: npm run build

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }} capstone-devops-revision-tracker/backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }} capstone-devops-revision-tracker/frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }}

  deploy-to-kind:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: revision-ci

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create namespace
        run: kubectl apply -f capstone-devops-revision-tracker/k8s/namespace.yaml

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace revision-tracker \
            --docker-server ghcr.io \
            --docker-username "${{ github.actor }}" \
            --docker-password "${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy SHA-tagged images with Helm
        run: |
          helm upgrade --install revision capstone-devops-revision-tracker/helm/revision-tracker \
            --namespace revision-tracker \
            --set backend.image=ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend \
            --set frontend.tag=${{ github.sha }} \
            --set imagePullSecrets[0].name=ghcr-secret

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/revision-revision-tracker-postgres -n revision-tracker --timeout=180s
          kubectl rollout status deployment/revision-revision-tracker-backend -n revision-tracker --timeout=180s
          kubectl rollout status deployment/revision-revision-tracker-frontend -n revision-tracker --timeout=180s
          kubectl get pods -n revision-tracker
          kubectl get services -n revision-tracker
          helm list -n revision-tracker
