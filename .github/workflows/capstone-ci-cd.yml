name: DevOps Revision Tracker CI/CD

on:
  push:
    branches: [main]
    paths:
      - "capstone-devops-revision-tracker/**"
      - ".github/workflows/capstone-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "capstone-devops-revision-tracker/**"
      - ".github/workflows/capstone-ci-cd.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: capstone-devops-revision-tracker/backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: capstone-devops-revision-tracker/backend
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: capstone-devops-revision-tracker/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: capstone-devops-revision-tracker/frontend
        run: npm ci

      - name: Build frontend
        working-directory: capstone-devops-revision-tracker/frontend
        run: npm run build

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }} capstone-devops-revision-tracker/backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }} capstone-devops-revision-tracker/frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.image.outputs.owner }}/revision-tracker-frontend:${{ github.sha }}
