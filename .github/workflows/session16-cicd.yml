name: Session 16 CI/CD Demo

on:
  push:
    branches: [main]
    paths:
      - "session-16-github-actions/homework/github-actions-cicd/**"
      - ".github/workflows/session16-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-github-actions/homework/github-actions-cicd/**"
      - ".github/workflows/session16-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: session-16-github-actions/homework/github-actions-cicd
  IMAGE_NAME: ghcr.io/whyseriouskaif/session16-cicd-demo

jobs:
  ci:
    name: CI - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install test dependency
        working-directory: ${{ env.PROJECT_DIR }}
        run: pip install -r requirements-dev.txt

      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall app.py

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -v

      - name: Prepare build artifact
        run: |
          mkdir -p build
          cp "${PROJECT_DIR}/app.py" build/
          cp "${PROJECT_DIR}/Dockerfile" build/

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: session16-application
          path: build/
          retention-days: 7

  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t session16-cicd:${GITHUB_SHA} "${PROJECT_DIR}"

      - name: Test container health
        run: |
          docker run -d --name session16-cicd -p 8080:8080 session16-cicd:${GITHUB_SHA}
          for attempt in 1 2 3 4 5; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs session16-cicd
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f session16-cicd || true

  publish:
    name: CD - Publish Image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
