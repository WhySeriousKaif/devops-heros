name: Session 17 DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-17-devsecops/homework/devsecops-demo-project/**"
      - ".github/workflows/session17-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-17-devsecops/homework/devsecops-demo-project/**"
      - ".github/workflows/session17-devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PROJECT_DIR: session-17-devsecops/homework/devsecops-demo-project
  IMAGE_NAME: ghcr.io/whyseriouskaif/session17-devsecops-demo

jobs:
  build-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall app.py

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pytest -v

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: session17-application
          path: |
            ${{ env.PROJECT_DIR }}/app.py
            ${{ env.PROJECT_DIR }}/Dockerfile
            ${{ env.PROJECT_DIR }}/requirements.txt
          retention-days: 7

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit>=1.8,<2"

      - name: Run Bandit security gate
        working-directory: ${{ env.PROJECT_DIR }}
        run: bandit -c security/bandit.yaml -r app.py -ll

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit>=2.9,<3"

      - name: Run dependency security gate
        working-directory: ${{ env.PROJECT_DIR }}
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks security gate
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ env.PROJECT_DIR }}/security/gitleaks.toml

  deliver:
    name: Container Gate, Push and Kubernetes Deploy
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t session17-devsecops:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            "${PROJECT_DIR}"

      - name: Container Scan - Trivy Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: session17-devsecops:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${IMAGE_NAME}:${GITHUB_SHA}
          docker tag ${IMAGE_NAME}:${GITHUB_SHA} ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:latest

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: session17

      - name: Load verified image into Kind
        run: kind load docker-image session17-devsecops:${GITHUB_SHA} --name session17

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f "${PROJECT_DIR}/kubernetes/namespace.yaml"
          sed "s|session17-devsecops:local|session17-devsecops:${GITHUB_SHA}|" \
            "${PROJECT_DIR}/kubernetes/deployment.yaml" | kubectl apply -f -
          kubectl apply -f "${PROJECT_DIR}/kubernetes/service.yaml"

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/devsecops-demo -n session17 --timeout=180s || {
            kubectl get pods -n session17 -o wide
            kubectl describe pods -n session17
            exit 1
          }
          kubectl get pods,service -n session17 -o wide
          kubectl port-forward service/devsecops-demo 8080:80 -n session17 > /tmp/session17-port-forward.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/session17-port-forward.log
          exit 1
