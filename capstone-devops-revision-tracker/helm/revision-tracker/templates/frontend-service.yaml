apiVersion: v1
kind: Service
metadata:
  name: {{ include "revision-tracker.fullname" . }}-frontend
  labels:
    {{- include "revision-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http

