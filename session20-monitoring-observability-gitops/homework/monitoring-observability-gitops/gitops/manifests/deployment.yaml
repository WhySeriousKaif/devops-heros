apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-app
  namespace: session20
  labels:
    app.kubernetes.io/name: session20-app
    app.kubernetes.io/managed-by: session20-gitops
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: session20-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session20-app
    spec:
      containers:
        - name: app
          image: session20-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
